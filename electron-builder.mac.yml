appId: com.lazify.app
productName: Lazify

# Native modules must be unpacked from asar so the OS can load them directly
asar: true
asarUnpack:
  - node_modules/node-pty/**/*

directories:
  buildResources: build
  output: release/mac

# The update feed. Artifacts go to a public repo of their own, because the
# updater reads the feed anonymously — pointed at this private source repo it
# would need a GitHub token shipped inside the app.
publish:
  provider: github
  owner: Anuboost-Long
  repo: lazify-dist
  # electron-builder drafts releases by default, and the updater cannot see a
  # draft. The workflow publishes straight to a real release instead.
  releaseType: release

# Ad-hoc signs the packaged app — see the script and mac.identity below
afterPack: ./src/scripts/mac-adhoc-sign.mjs

files:
  - dist/**/*
  - dist-electron/**/*
  - node_modules/**/*
  - package.json

# Templates and the icon are bundled as plain files in the resources folder —
# electron-builder always excludes directories.buildResources (build/) from
# `files`, even when explicitly listed, so app.isPackaged path resolution
# (see icon-path.ts and harmonizer.ts) has to look for them here instead.
extraResources:
  - from: templates
    to: templates
  - from: build/icon.png
    to: icon.png

mac:
  icon: build/icon.icns
  category: public.app-category.developer-tools
  # No version in the name, so `releases/latest/download/Lazify-arm64.zip` is a
  # stable URL. install.sh and the README link to it by that name and never
  # need editing when a release goes out. Covers the zip; the dmg overrides it
  # below with the same shape.
  artifactName: ${productName}-${arch}.${ext}
  # There is no Developer ID Application certificate to sign with, and without
  # one the build cannot be notarized. Left to auto-discovery electron-builder
  # picks up the Apple Development certificate instead, which is only valid on
  # Macs provisioned for the team — every other Mac reports the download as
  # "damaged" with no way past it. Turning discovery off and ad-hoc signing in
  # afterPack downgrades that to the approvable "unidentified developer" prompt.
  identity: null
  # The DMG compiler styles the window inside the images it builds by scripting
  # Finder. Under the hardened runtime that needs the apple-events entitlement,
  # and macOS refuses to even show the approval prompt without a reason string
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSAppleEventsUsageDescription: >-
      Lazify controls Finder to arrange the window layout inside the disk images
      it builds.
  # Two separate thin builds — arm64 for Apple Silicon, x64 for Intel
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64

dmg:
  # Always suffix the arch — electron-builder omits it for x64 by default,
  # leaving the Intel disk image indistinguishable from a universal one
  artifactName: ${productName}-${arch}.${ext}
  title: Lazify ${version} (${arch})
  window:
    width: 540
    height: 380
