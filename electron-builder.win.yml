appId: com.lazify.app
productName: Lazify

# Native modules must be unpacked from asar so Windows can load the .node binary
asar: true
asarUnpack:
  - node_modules/node-pty/**/*

directories:
  buildResources: build
  output: release/win

# The update feed — see the note in electron-builder.mac.yml.
publish:
  provider: github
  owner: Anuboost-Long
  repo: lazify-dist
  releaseType: release

files:
  - dist/**/*
  - dist-electron/**/*
  - node_modules/**/*
  - package.json

# Templates and the icon are bundled as plain files in the resources folder —
# electron-builder always excludes directories.buildResources (build/) from
# `files`, even when explicitly listed, so app.isPackaged path resolution
# (see icon-path.ts and harmonizer.ts) has to look for them here instead.
extraResources:
  - from: templates
    to: templates
  - from: build/icon.png
    to: icon.png

win:
  icon: build/icon.ico
  # Named per arch the way the mac builds are, so the download URLs are stable
  # and an arm64 installer can never be mistaken for the x64 one.
  artifactName: ${productName}-Setup-${arch}.${ext}
  # x64 only for now. The plan is a build per architecture, matching macOS —
  # but node-pty ships a prebuilt binary per arch and has to be rebuilt against
  # Electron, and cross-compiling it for arm64 on the x64 CI runner is the part
  # that is unproven. Adding arm64 here fails the whole Windows job if it does
  # not work, x64 included, so it goes in only after an x64 release is green.
  target:
    - target: nsis
      arch:
        - x64

nsis:
  # User-facing installer — not a silent one-click install
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Lazify
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  # Prevents installing multiple copies side-by-side
  allowElevation: true
  perMachine: false
