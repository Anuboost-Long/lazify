name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # All three, because most of what breaks per-platform breaks silently — a
    # shell that is not there, a binary with another name — and only shows up
    # as a feature that quietly does nothing on the OS nobody develops on.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest, ubuntu-22.04]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - run: yarn install --frozen-lockfile

      - name: Typecheck renderer
        run: npx tsc --noEmit -p tsconfig.json

      - name: Typecheck main and preload
        run: npx tsc --noEmit -p tsconfig.node.json

      - run: yarn test

      # Catches a renderer that typechecks but will not bundle.
      - run: yarn build:renderer
